# yaml-language-server: $schema=./catalog.schema.json
# Planning scenarios; not registered executions or evidence of a pass.
schema_version: 1
feature: activity
status: planned
scenarios:
  - id: activity.space-overview
    capabilities:
      - activity/overview
    context: >-
      The caller can read a dashboard with active, blocked and completed work
      plus idle agents.
    query: >-
      Give me a quick picture of what the space is doing right now.
    expected_outcome: >-
      The answer summarizes actual visible work and relevant blockers with links
      and an observation time. It distinguishes idle agents from broken ones and
      active tasks from scheduled future work. Counts reflect the caller's scope
      rather than hidden space resources.
  - id: activity.audit-change
    capabilities:
      - activity/activity
    context: >-
      A task's priority changed twice this week; the agent has space
      activity-read access.
    query: >-
      Who changed the priority of the website task?
    expected_outcome: >-
      The agent reads attributed activity for the exact task and reports the
      relevant actors, times and changes. It pages as needed and does not infer
      the editor from the current assignee. Restricted audit exports or raw
      event creation are not used as substitutes for ordinary read access.
  - id: activity.find-runs
    capabilities:
      - activity/runs
    context: >-
      The task had an interrupted attempt and a later continuation, both visible
      to the caller.
    query: >-
      Show me the runs behind this website task.
    expected_outcome: >-
      The answer links each relevant execution to its actual task and agent and
      summarizes current or terminal state. It preserves failed and interrupted
      attempts instead of presenting only the successful continuation. Read
      access to a task alone is not treated as authority to expose every run
      detail.
  - id: activity.work-timeline
    capabilities:
      - activity/timeline
    context: >-
      Several visible launch tasks have timestamped changes and handoffs.
    query: >-
      Walk me through how the launch work progressed this week.
    expected_outcome: >-
      The agent builds an ordered account from saved timeline and task events,
      including pauses and failed attempts. It respects any explicitly requested
      timezone and distinguishes recorded facts from interpretation. Links let
      the person inspect the major milestones without exposing hidden tasks.
