# yaml-language-server: $schema=./catalog.schema.json
# Planning scenarios; not registered executions or evidence of a pass.
schema_version: 1
feature: workspaces
status: planned
scenarios:
  - id: workspaces.locate-files
    capabilities:
      - workspaces/binding
    context: >-
      The website task has a projectless execution workspace; the agent may read
      its current binding.
    query: >-
      Where are the files for the website task actually being worked on?
    expected_outcome: >-
      The response identifies the workspace bound to that task and points to the
      supported file or workspace view. It does not infer the location from an
      agent's default directory or a project name. Any pending workspace
      selection is distinguished from the active binding.
  - id: workspaces.inspect-git
    capabilities:
      - workspaces/files-git
    context: >-
      The task's repository contains a synthetic uncommitted header edit and an
      unrelated existing change.
    query: >-
      Show me what changed in the website files.
    expected_outcome: >-
      The agent inspects the actual authorized workspace and summarizes the
      relevant diff with file references. It preserves pre-existing changes and
      distinguishes committed from uncommitted work. It does not claim the
      remote repository was updated or inspect a similarly named checkout
      elsewhere on the host.
  - id: workspaces.close-and-reopen
    capabilities:
      - workspaces/closure
    context: >-
      A completed task workspace has retained files and no active run; the actor
      has the supported closure permission.
    query: >-
      Close this workspace for now, but let me come back to the files later.
    expected_outcome: >-
      The permitted close operation changes lifecycle state while retaining the
      promised work and source references. Chat explains the supported reopen or
      retrieval path and verifies the actual state. Closure is not treated as
      deleting files, force-reconciling a branch or cancelling another task's
      workspace.
