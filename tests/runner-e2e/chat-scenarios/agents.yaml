# yaml-language-server: $schema=./catalog.schema.json
# Planning scenarios; not registered executions or evidence of a pass.
schema_version: 1
feature: agents
status: planned
scenarios:
  - id: agents.create-claude-code
    capabilities:
      - agents/create
      - agents/coordination
      - runs-adapters/validation
    context: >-
      No agent named Morgan exists. The CEO has creation and configuration
      grants, an eligible Claude Code account and computer are ready, and space
      policy does not require approval for this create.
    query: >-
      Create Morgan as a frontend engineer using Claude Code, reporting to you.
    expected_outcome: >-
      The agent creates one permanent Morgan with the requested role, reporting
      line, harness and usable account binding. Chat links to the saved profile
      and distinguishes creation from runtime readiness. It verifies the saved
      configuration and reports any failed validation rather than calling an
      unusable create ready.
  - id: agents.edit-instructions
    capabilities:
      - agents/instructions
    context: >-
      Morgan has a writable instruction bundle with a saved revision. The CEO
      may update it; unrelated files contain existing guidance.
    query: >-
      Add a rule for Morgan to run the relevant tests before handing work back.
    expected_outcome: >-
      Morgan's durable instructions gain the requested rule while retaining
      unrelated guidance. The response links to the agent or revision and
      explains when future work will use it. A concurrent human edit made during
      the run is merged: the saved result keeps the newer instructions and adds
      the rule rather than silently overwriting them.
  - id: agents.restore-instructions
    capabilities:
      - agents/instructions
    context: >-
      Someone just added an unwanted rule to Morgan's instructions. Outpost
      keeps only the current instruction files: saving does not record earlier
      versions, so Morgan's history is empty and no other saved copy of the
      earlier text exists.
    query: >-
      Undo Morgan's last instruction change.
    expected_outcome: >-
      The agent checks what Outpost actually retains instead of guessing. With
      no saved earlier version, it leaves Morgan's instructions unchanged, does
      not reconstruct or invent a previous revision, says plainly that no
      instruction history exists to undo from, and asks the person for the text
      they want (or which rule to remove). If a real retained copy of the
      earlier text existed, restoring exactly that would be acceptable instead.
  - id: agents.change-manager
    capabilities:
      - agents/coordination
    context: >-
      Riley is a CTO, Morgan reports to the CEO, and the CEO can edit reporting
      lines.
    query: >-
      Have Morgan report to Riley from now on.
    expected_outcome: >-
      Morgan's saved manager becomes Riley and the org view agrees after reload.
      The agent checks that the result remains a valid space reporting tree and
      does not change Morgan's account, task ownership or permissions just
      because the manager changed.
  - id: agents.choose-primary
    capabilities:
      - agents/default-agent
      - agent-chat/discovery
    context: >-
      The person has a default agent already and wants Morgan instead.
      Primary-agent preferences require the person's operator session.
    query: >-
      Make Morgan my go-to agent when I open Chat.
    expected_outcome: >-
      The agent explains the personal default-agent choice and directs the
      person to Morgan's supported profile control, including the replacement
      confirmation. After the human action, the preference belongs only to that
      person and space; a valid recent chat can still reopen first. Chat does
      not falsely report a preference write by the agent.
  - id: agents.pause-agent
    capabilities:
      - agents/lifecycle
    context: >-
      Morgan is working on a task. Pausing an agent requires board control.
    query: >-
      Pause Morgan until I say otherwise.
    expected_outcome: >-
      The agent provides the exact agent profile/control for the authorized
      human to pause Morgan and makes the pending human step explicit. It does
      not claim a completed pause from a chat acknowledgement. The resulting
      journey checks actual pause state and explains how existing work settles
      under that control.
  - id: agents.resume-agent
    capabilities:
      - agents/lifecycle
    context: >-
      Morgan is manually paused, the CEO has agent_config:update, and no budget,
      approval or space hold remains.
    query: >-
      Resume Morgan so they can pick up their work.
    expected_outcome: >-
      The permitted resume operation changes Morgan's saved availability and
      chat links to the affected agent. The agent distinguishes being available
      from a particular run having started. If another execution gate remains,
      the response reports that gate instead of promising work has resumed.
  - id: agents.retire-agent
    capabilities:
      - agents/lifecycle
    context: >-
      Morgan is an ordinary agent with historical tasks and an active
      assignment. Termination is board-only.
    query: >-
      Retire Morgan, but keep their old work.
    expected_outcome: >-
      The agent identifies the intended agent and guides the authorized person
      through the supported retirement control and assignment consequences.
      Historical tasks and attribution remain inspectable. It never treats
      deleting history or simply renaming the agent as successful retirement.
