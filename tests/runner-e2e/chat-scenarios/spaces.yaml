# yaml-language-server: $schema=./catalog.schema.json
# Planning scenarios; not registered executions or evidence of a pass.
schema_version: 1
feature: spaces
status: planned
scenarios:
  - id: spaces.switch-space
    capabilities:
      - spaces/selection
      - access/resources
    context: >-
      The signed-in person belongs to Acorn and Birch; this standing agent
      conversation is bound to Acorn.
    query: >-
      Switch to Birch and show me what its team is doing.
    expected_outcome: >-
      The response guides the person to the supported space selection and an
      eligible Birch conversation or view. It does not retarget the existing
      Acorn agent's credentials or read Birch data through Acorn tools. The
      browser and links retain explicit space context after switching.
  - id: spaces.rename-space
    capabilities:
      - spaces/identity
    context: >-
      The CEO is in Acorn and has the supported same-space identity-edit
      authority.
    query: >-
      Rename this space to Acorn Studio.
    expected_outcome: >-
      The space identity change persists through the allowed path and the UI and
      returned links still refer to the same space ID. Existing tasks, projects
      and memberships remain attached. The agent does not create a second space
      or change another selected space with a similar name.
  - id: spaces.archive-space
    capabilities:
      - spaces/archive
    context: >-
      Acorn is a disposable fixture space; the request is explicit and the
      current deployment offers a human archive control.
    query: >-
      Archive this test space and let me restore it later.
    expected_outcome: >-
      The agent identifies Acorn and the supported archive path with the actual
      governance boundary. The human journey verifies archived and restored
      state while preserving history and memberships according to the product
      contract. Chat does not treat archival as deletion or claim active work
      continued normally through an archived-space gate.
